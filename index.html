<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090a">
<title>Momentum Desk (PAPER)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo">◢</span> Momentum <span class="paper">PAPER</span></div>
    <div id="livepill" class="livepill off"><i></i><span>CONNECTING</span></div>
  </header>
  <main>
    <section id="v-home" class="view"></section>
    <section id="v-agents" class="view" hidden></section>
    <section id="v-activity" class="view" hidden></section>
    <section id="v-account" class="view" hidden></section>
    <section id="v-coin" class="view coinview" hidden></section>
  </main>
  <nav id="tabs">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button data-tab="agents"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Agents</span></button>
    <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Activity</span></button>
    <button data-tab="account"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg><span>Account</span></button>
  </nav>
</div>
<canvas id="confetti"></canvas>
<script src="app.js"></script>
</body>
</html>
